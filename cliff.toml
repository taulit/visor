# git-cliff configuration for the release notes of Visor (.github/workflows/release.yml).
# The commits follow Conventional Commits; see CONTRIBUTING.md.
# Try it locally: git cliff --unreleased

[changelog]
header = ""
body = '''
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first | trim }}{% if commit.breaking %} (**breaking**){% endif %}
{% endfor %}
{% endfor %}
'''
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = false
topo_order = false
sort_commits = "oldest"
tag_pattern = "v[0-9].*"
commit_parsers = [
  { message = "^Merge ", skip = true },
  { message = "^wip", skip = true },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^i18n", group = "Translations" },
  { message = "^docs", group = "Documentation" },
  { message = "^(test|ci|build|chore|style)", group = "Maintenance" },
]
