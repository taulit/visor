name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install system packages
        run: sudo apt-get install -y libglib2.0-bin gettext zip
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Compile the schema strictly
        run: glib-compile-schemas --strict --dry-run schemas
      - name: Check that the module table of the README is current
        run: pnpm run readme:check
      - run: pnpm sdk:check
      - name: Build the module template in a clean copy
        run: pnpm template:check
        env:
          TEMPLATE_CHECK_INSTALL: '1'
      - run: pnpm run pack:zip
      - uses: actions/upload-artifact@v4
        with:
          name: visor-extension
          path: dist/*.zip
          if-no-files-found: error
